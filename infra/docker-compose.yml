# ---------------------------------------------------------------------------
# TalentPipe local infrastructure — PostgreSQL (+ optional full backend).
#
# Image: pgvector/pgvector:pg15 = official PostgreSQL 15 with the pgvector
# extension pre-installed (required because V1__extensions.sql runs
# `CREATE EXTENSION vector`; the vanilla postgres:15 image does not ship it).
#
# Usage:  cp .env.example .env   (adjust if needed)
#         docker compose up -d postgres      # database only (usual dev setup)
#         docker compose up -d               # database + containerized backend
#
# The frontend lives in its own repository: talentpipe-frontend.
# ---------------------------------------------------------------------------
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: talentpipe-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talentpipe}
      POSTGRES_USER: ${POSTGRES_USER:-talentpipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentpipe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - talentpipe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentpipe} -d ${POSTGRES_DB:-talentpipe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: talentpipe-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/talentpipe
      DB_USERNAME: ${POSTGRES_USER:-talentpipe}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-talentpipe}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-at-least-32-bytes-long-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Empty key = console email mode (links go to the backend log).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  sonarqube:
    # Optional local code-quality server — NOT part of the normal dev stack.
    # Start with:  docker compose --profile sonar up -d sonarqube
    # Then see docs/QUALITY.md for the one-time token setup.
    image: sonarqube:community
    profiles: ["sonar"]
    container_name: talentpipe-sonarqube
    environment:
      # Avoids the vm.max_map_count bootstrap check failing on some hosts.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  talentpipe_pgdata:
  sonarqube_data:
  sonarqube_extensions:
