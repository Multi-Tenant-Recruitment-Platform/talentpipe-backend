# ---------------------------------------------------------------------------
# TalentPipe local stack.
#
# Image: pgvector/pgvector:pg15 = official PostgreSQL 15 with the pgvector
# extension pre-installed (required because V1__extensions.sql runs
# `CREATE EXTENSION vector`; the vanilla postgres:15 image does not ship it).
#
# Usage:  cp .env.example .env   (adjust if needed)
#         docker compose up -d postgres              # database only (usual dev setup)
#         docker compose up -d --build               # database + containerized backend
#         docker compose --profile full up -d --build
#             # the whole platform, built from source, the way production
#             # serves it: http://localhost:5173 (SPA, /api proxied to the backend)
#
# The frontend lives in its own repository, talentpipe-frontend. The `full`
# profile builds it from FRONTEND_DIR, by default a clone next to this one.
# See docs/DEPLOYMENT.md for the details and for production on AWS.
# ---------------------------------------------------------------------------
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: talentpipe-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talentpipe}
      POSTGRES_USER: ${POSTGRES_USER:-talentpipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentpipe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - talentpipe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentpipe} -d ${POSTGRES_DB:-talentpipe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Builds from source (multi-stage Dockerfile): no local JDK or jar needed.
    # The image's own HEALTHCHECK probes /actuator/health/liveness.
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: talentpipe-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/talentpipe
      DB_USERNAME: ${POSTGRES_USER:-talentpipe}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-talentpipe}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-at-least-32-bytes-long-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Empty key = console email mode (links go to the backend log).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      # Storage — 'local' for dev, 's3' for production.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      # AWS — required only when STORAGE_PROVIDER=s3.
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-south-1}
      AWS_CDN_BASE_URL: ${AWS_CDN_BASE_URL:-}
    ports:
      - "8080:8080"
    volumes:
      - talentpipe_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    # The SPA in its production image (nginx, non-root), proxying /api to the
    # backend container, so the browser sees one origin as it does on AWS.
    profiles: ["full"]
    build:
      context: ${FRONTEND_DIR:-../../talentpipe-frontend}
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: talentpipe-frontend
    restart: unless-stopped
    environment:
      # No trailing slash; nginx appends the request URI.
      BACKEND_ORIGIN: http://backend:8080
    ports:
      # 5173 matches the backend's FRONTEND_BASE_URL default, so links in
      # emails (console mode: in the backend log) open this container.
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy

  sonarqube:
    # Optional local code-quality server — NOT part of the normal dev stack.
    # Start with:  docker compose --profile sonar up -d sonarqube
    # Then see docs/QUALITY.md for the one-time token setup.
    image: sonarqube:community
    profiles: ["sonar"]
    container_name: talentpipe-sonarqube
    environment:
      # Avoids the vm.max_map_count bootstrap check failing on some hosts.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  talentpipe_pgdata:
  talentpipe_uploads:
  sonarqube_data:
  sonarqube_extensions:

