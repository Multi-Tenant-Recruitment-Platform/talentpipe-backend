# ---------------------------------------------------------------------------
# TalentPipe backend configuration.
#
# All environment-specific values are injected via environment variables so
# the same artifact runs unchanged in every environment (12-factor). See
# infra/.env.example for the full list of variables and local defaults.
# ---------------------------------------------------------------------------
spring:
  application:
    name: talentpipe-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talentpipe}
    username: ${DB_USERNAME:talentpipe}
    password: ${DB_PASSWORD:talentpipe}

  jpa:
    # Flyway owns the schema; Hibernate only validates that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    # The GlobalExceptionHandler owns error responses; suppress the default
    # whitelabel/attribute leakage.
    include-message: never
    include-stacktrace: never

talentpipe:
  security:
    jwt:
      # HS256 signing secret. MUST be at least 32 bytes (256 bits). There is
      # deliberately no default: the application fails fast at startup if the
      # secret is not provided, so a weak dev secret can never leak into an
      # environment unnoticed.
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    cors:
      # Vite dev server origin; production origins are injected per environment.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  app:
    # Base URL of the frontend SPA. Used to build links in emails (verification,
    # password reset, invitations). Override per environment via FRONTEND_BASE_URL.
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  resend:
    # Resend API key. NO default on purpose: without a key the application runs
    # in console mode (links are logged, nothing is sent) — see EmailConfig.
    # Never commit a real key; supply it via the RESEND_API_KEY env var only.
    api-key: ${RESEND_API_KEY:}
    # Sender address. The resend.dev sandbox sender only delivers to the Resend
    # account owner's own inbox; emailing real recipients requires a VERIFIED
    # sending domain configured in Resend (see README).
    from: ${MAIL_FROM:onboarding@resend.dev}

logging:
  level:
    com.talentpipe: INFO
