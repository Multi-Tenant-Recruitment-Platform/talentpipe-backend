name: backend-ci

on:
  pull_request:
    branches: [master, development]
  push:
    branches: [master, development]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Build and run all tests
        working-directory: backend
        run: ./mvnw -B clean verify
        env:
          JWT_SECRET: ci-only-secret-at-least-32-bytes-long-0123456789

  # Infrastructure as code: the same checks as on a developer's machine
  # (docs/DEPLOYMENT.md), with pinned tool versions. Nothing here talks to AWS:
  # the Terraform tests run against a mocked provider.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform format, validate and test
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          tf() { docker run --rm -v "$PWD:/w" -w "/w/$1" hashicorp/terraform:1.17.2 "${@:2}"; }
          tf . fmt -check -recursive -diff
          tf . init -backend=false -input=false
          tf . validate
          tf . test
          tf bootstrap init -backend=false -input=false
          tf bootstrap validate

      - name: CloudFront functions
        run: node --test infra/terraform/functions/functions.test.js

      - name: Security scan of the Terraform and the Dockerfile
        run: |
          for target in infra/terraform backend; do
            docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.76.2 config --quiet --exit-code 1               --severity MEDIUM,HIGH,CRITICAL --skip-dirs '**/.terraform' "/src/$target"
          done

      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < backend/Dockerfile

  sonar:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze
        working-directory: backend
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JWT_SECRET: ci-only-secret-at-least-32-bytes-long-0123456789
