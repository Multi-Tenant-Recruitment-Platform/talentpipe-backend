name: backend-ci

on:
  pull_request:
    branches: [master, development]
  push:
    branches: [master, development]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      # GitHub-hosted runners have Docker, so the full suite runs —
      # including the Testcontainers/PostgreSQL integration tests.
      - name: Build and run all tests
        working-directory: backend
        run: ./mvnw -B verify
        env:
          JWT_SECRET: ci-only-secret-at-least-32-bytes-long-0123456789

  # Static analysis + coverage via SonarCloud (or a self-hosted SonarQube).
  # Inactive until SONAR_TOKEN is configured — see docs/QUALITY.md.
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate new-code analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Sonar analysis (skipped until SONAR_TOKEN is set)
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: backend
        run: >
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url="$SONAR_HOST_URL"
          -Dsonar.organization="$SONAR_ORGANIZATION"
          -Dsonar.projectKey="$SONAR_PROJECT_KEY"
        env:
          JWT_SECRET: ci-only-secret-at-least-32-bytes-long-0123456789
